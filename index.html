<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-icon" content="icon.svg?v=4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Walsall">
<title>Walsall Evidence</title>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<header class="topbar"><div><strong>Walsall Evidence</strong><span id="courseLabel">Loading course…</span></div><div class="top-actions"><button id="installBtn" class="install-btn hidden" type="button">Install</button><button id="profileBtn" class="icon-btn" aria-label="Profile">⚙</button></div></header>
<main id="app"><div class="loading">Loading your course packs…</div></main>
<nav class="bottom-nav">
<button data-view="home">Home</button><button data-view="packs">Packs</button><button data-view="otj">OTJ</button><button data-view="profile">Profile</button>
</nav>
<div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="app.js?v=7"></script>
<script>
// Learners are NOT required to provide six photos. Any number of captured photos is accepted; unused PDF slots remain blank.
(function(){
  const originalOpenPack=window.openPack;
  window.openPack=async function(i){
    await originalOpenPack(i);
    const btn=document.querySelector('button[onclick^="downloadPack("]');
    if(btn){btn.disabled=false;btn.removeAttribute('disabled');}
  };
  window.downloadPack=async function(i){
    const p=state.packs[i],e=state.evidence[p.id]||{};
    if(!e.signature){toast('Please sign the touchscreen signature box before downloading');return}
    if((e.statement||'').trim().length<100){toast('Please complete the statement with at least 100 words');return}
    const photos=await Promise.all(p.capture.map((_,n)=>photoGet(photoKey(p.id,n)).catch(()=>null)));
    const doc=newPdf();
    drawPhotoPage(doc,p,photos);
    drawDetailsPage(doc,p,e);
    const safe=(p.title||'evidence-pack').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
    doc.save(`walsall-${safe}-${formatUKDate(e.signedDate||todayISO()).replaceAll('/','-')}.pdf`);
  };
})();
</script>
<script>
(function(){
  const btn=document.getElementById('installBtn');
  let deferredPrompt=null;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(standalone){btn.classList.add('hidden');return;}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.classList.remove('hidden');});
  window.addEventListener('appinstalled',()=>{deferredPrompt=null;btn.classList.add('hidden');});
  if(isIOS) btn.classList.remove('hidden');
  btn.addEventListener('click',async()=>{
    if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.classList.add('hidden');return;}
    if(isIOS){alert('To install Walsall on iPhone: tap Share, then Add to Home Screen, then Add.');return;}
    alert('Use your browser menu and choose Install app or Add to home screen.');
  });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=7').catch(()=>{}));}</script>
</body>
</html>
