<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173331"><title>Walsall · 6570-05 Demo</title>
<style>
:root{--bg:#f6f8f6;--surface:#fff;--surface2:#f1f5f3;--text:#173331;--muted:#657774;--line:#dbe4e1;--green:#1f8f68;--greenDark:#14634c;--shadow:0 8px 24px rgba(23,51,49,.07);--radius:18px}
*{box-sizing:border-box}html{background:var(--bg);overflow-x:hidden}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:86px}.top{position:sticky;top:0;z-index:5;background:rgba(246,248,246,.94);backdrop-filter:blur(12px);padding:14px 18px 10px;border-bottom:1px solid rgba(219,228,225,.7);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:18px}.sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}.logo{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.page{padding:18px}.hero{background:var(--text);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.eyebrow{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:28px;line-height:1.08;margin:7px 0 14px}.progress{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:72%;background:#72d2a9;border-radius:99px}.progress-row{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;opacity:.78}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:12px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.confidence{display:flex;align-items:center;gap:14px}.score{width:70px;height:70px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:21px;font-weight:800;color:var(--greenDark)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pack{cursor:pointer}.pack strong{display:block;font-size:15px}.pack small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}.pill{display:inline-flex;padding:6px 9px;border-radius:99px;background:var(--surface2);color:var(--greenDark);font-size:11px;font-weight:700}.cta{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;padding:13px 15px;font-weight:800;margin-top:8px}.ghost{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);padding:12px 15px;font-weight:700;margin-top:8px}.bottom{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 2px}.bottom button.active{color:var(--greenDark);font-weight:800}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{aspect-ratio:1/1;border:1.5px dashed #b9c9c4;border-radius:15px;background:var(--surface2);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;padding:12px}.steps{display:grid;gap:9px}.step{display:flex;gap:10px;align-items:flex-start}.num{min-width:26px;height:26px;border-radius:50%;background:var(--surface2);color:var(--greenDark);display:grid;place-items:center;font-weight:800;font-size:12px}.checklist{padding:0;margin:0;list-style:none}.checklist li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.checklist li:last-child{border-bottom:0}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 10px;font-size:12px}.tag.on{background:#e5f5ee;border-color:#b8dfce;color:var(--greenDark);font-weight:700}textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;outline:none}select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:var(--text)}.back{border:0;background:transparent;padding:0;color:var(--greenDark);font-weight:800;margin-bottom:12px}.hidden{display:none!important}
</style></head><body>
<div class="app"><header class="top"><div><div class="brand">Walsall Evidence</div><span class="sub">6570-05 · Level 3 Trowel Occupations</span></div><div class="logo">A+</div></header><main id="page" class="page"></main><nav class="bottom"><button data-nav="home">Home</button><button data-nav="packs">Evidence</button><button data-nav="academy">Academy</button><button data-nav="settings">Settings</button></nav></div>
<script>
const packs=[
['Set out masonry','Solid/cavity set-out, openings, profiles, line, level and dimensions'],['Build cavity walling','Brick/block walling, returns, openings, bond and wall ties'],['Install cavity details','Insulation, DPC, trays, weeps, fire stopping and closures'],['Form openings & lintels','Opening dimensions, lintels, bearing and feature courses'],['Build solid walling','Solid walls, bonds, capping and quality checks'],['Build piers & decorative walling','Piers, projecting brickwork, contrasting and banding'],['Build raking or gable walling','Rake set-out, cutting, construction and finish'],['Mix mortar','Gauging, ratios, hand/mechanical/silo mixing'],['Cut bricks & blocks','Measure, mark, hand cut and power cut where appropriate'],['Apply joint finishes','Half-round, flush, weather-struck and recessed'],['Repair brickwork','Identify defect, remove, replace and match'],['Complete & protect masonry','Final checks, protection, waste and finished condition']
];
let completed=new Set(),view='home',selected=0;
const $=id=>document.getElementById(id);
function nav(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));}
function home(){view='home';selected=0;let done=Math.round(completed.size/packs.length*100);$('page').innerHTML=`<section class="hero"><div class="eyebrow">Course</div><h1>6570-05<br>Level 3 Trowel Occupations</h1><div class="progress"><span style="width:${done}%"></span></div><div class="progress-row"><span>Evidence progress</span><span>${done}%</span></div></section><section class="card confidence"><div class="score">72%</div><div><h3>Overall confidence</h3><div class="muted">Your current confidence across the evidence packs.</div></div></section><section class="card"><div class="row"><div><h3>Evidence packs</h3><div class="muted">Follow each natural task, capture evidence and complete the pack.</div></div><span class="pill">${completed.size}/${packs.length}</span></div><button class="cta" onclick="packsView()">Open evidence packs</button></section><section class="card"><h3>Off-the-job learning</h3><div class="muted">Record your hours and keep your learning evidence together.</div><button class="ghost" onclick="toast('OTJ area is unchanged in the main Walsall app.')">Open OTJ</button></section>`;nav();}
function packsView(){view='packs';$('page').innerHTML=`<section><div class="row" style="margin-bottom:12px"><div><h2>Evidence packs</h2><div class="muted">Natural tasks rather than assessment-criteria lists.</div></div><span class="pill">${completed.size}/${packs.length}</span></div>${packs.map((p,i)=>`<section class="card pack" onclick="openPack(${i})"><div class="row"><div><strong>${i+1}. ${p[0]}</strong><small>${p[1]}</small></div><span class="pill">${completed.has(i)?'Complete':'Start'}</span></div></section>`).join('')}</section>`;nav();}
function openPack(i){selected=i;view='pack';let p=packs[i];$('page').innerHTML=`<button class="back" onclick="packsView()">‹ Evidence packs</button><section class="hero"><div class="eyebrow">Pack ${i+1} of ${packs.length}</div><h1>${p[0]}</h1><div class="muted" style="color:#c8d5d2">${p[1]}</div></section><section class="card"><h3>What to capture</h3><ul class="checklist"><li>Show the work before, during and after the task where useful.</li><li>Include safe working, preparation and the finished result.</li><li>Make sure the evidence clearly shows your own work.</li></ul></section><section class="card"><div class="step"><div class="num">1</div><div><h3>Take your photos</h3><div class="muted">Use clear, relevant photos. Add more where the task needs it.</div></div></div><div class="photo-grid" style="margin-top:12px">${[1,2,3,4,5,6].map(n=>`<div class="photo">+ Photo ${n}<br><small>Tap to add</small></div>`).join('')}</div></section><section class="card"><div class="step"><div class="num">2</div><div><h3>What else is shown?</h3><div class="muted">Select anything relevant to the evidence.</div></div></div><div class="tags" style="margin-top:12px">${['PPE','RAMS','Drawings','Materials','Tools','Quality','Waste','Teamwork'].map((x,i)=>`<button class="tag ${i<3?'on':''}" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div></section><section class="card"><div class="step"><div class="num">3</div><div><h3>Explain your work</h3><div class="muted">Briefly describe what you did, how you did it and why.</div></div></div><textarea placeholder="Write your statement here…" style="margin-top:12px"></textarea><button class="ghost" onclick="toast('Audio capture can be connected here without changing the rest of Walsall.')">Add audio</button></section><section class="card"><div class="step"><div class="num">4</div><div><h3>Knowledge & evidence</h3><div class="muted">Mapped knowledge and behaviours can be reviewed alongside the practical evidence.</div></div></div><div class="tags" style="margin-top:12px"><span class="tag on">Knowledge</span><span class="tag on">Behaviour</span><span class="tag">Skills</span></div></section><section class="card"><div class="step"><div class="num">5</div><div><h3>Review & complete</h3><div class="muted">Check your evidence and rate your confidence before completing the pack.</div></div></div><div class="row" style="margin-top:12px"><span class="muted">Confidence</span><select id="confidence"><option>1 — Not confident</option><option>2</option><option>3 — Getting there</option><option>4</option><option selected>5 — Confident</option></select></div><button class="cta" onclick="completePack(${i})">Complete pack</button></section>`;nav();}
function completePack(i){completed.add(i);toast('Pack marked complete in this demo.');setTimeout(()=>packsView(),250)}
function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#173331;color:white;padding:11px 14px;border-radius:12px;font-size:12px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.15)';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='home')home();else if(b.dataset.nav==='packs')packsView();else toast(b.dataset.nav==='academy'?'Academy is a demo area.':'Settings remain unchanged in the main Walsall app.')});home();
</script></body></html>
